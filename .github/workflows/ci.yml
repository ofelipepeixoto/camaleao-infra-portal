name: Offline reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run offline policy and contract checks
        run: python3 -m unittest discover -s tests -v
      - name: Run deterministic demonstration
        run: python3 scripts/demo.py
